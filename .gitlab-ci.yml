stages:
  - build
  - deploy

.releases: &releases
  only:
    - /^v\d[\d\.]*(-classic-?)?(-(alpha|beta))?(-\d+)?$/
    
before_script:
  - apk add --no-cache bash curl git subversion zip jq luacheck
  - apk add --no-cache --repository http://dl-3.alpinelinux.org/alpine/edge/testing/ --allow-untrusted pandoc

luacheck:
  stage: build
  script:
    - luacheck . -q && echo "Lua check passed!" || echo "Lua check failed!"

package:
  stage: build
  only:
    - tags
    - web
  script:
    - cd .release
    - chmod +x ./release.sh
    - ./release.sh -d
  artifacts:
    paths:
      - .release/VuhDo/
      - .release/VuhDoOptions/
      - .release/*.zip
  
upload:
  <<: *releases
  stage: deploy
  script:
    - cd .release
    - chmod +x ./release.sh
    - ./release.sh -ocelz

